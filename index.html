<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="منصة وثيق لإدارة مكاتب المحاماة: القضايا والجلسات والموكلون والمالية في مكان واحد. نسخة عرض تجريبية.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>منصة وثيق لإدارة مكاتب المحاماة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar (right, RTL) + sticky top bar + content; each section is a hash route */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface2:#eef0eb; --line:#dfe2da;
  --fg:#18201c; --muted:#5f6b63; --ink:#123a2e; --ink-fg:#e9f1ec;
  --accent:#a8792b; --accent-soft:#f5ead6; --brand:#1d5a46; --brand-soft:#dcebe4;
  --ok:#2f7d4f; --ok-soft:#dff1e6; --warn:#b07009; --warn-soft:#fbefd6; --bad:#b4322c; --bad-soft:#f9e1df; --info:#2b5f97; --info-soft:#e0ebf7;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --surface2:#1d2722; --line:#2a3630; --fg:#e6ece8; --muted:#97a69d; --ink:#0a110d; --ink-fg:#d9e6de;
  --accent:#d6a650; --accent-soft:#3a2f1b; --brand:#5bb894; --brand-soft:#1d3329;
  --ok:#5cc28a; --ok-soft:#1b3326; --warn:#e3a843; --warn-soft:#3a2d14; --bad:#ec7b73; --bad-soft:#3d1e1c; --info:#7fb0e8; --info-soft:#1a2b3f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface2:#1d2722; --line:#2a3630; --fg:#e6ece8; --muted:#97a69d; --ink:#0a110d; --ink-fg:#d9e6de;
  --accent:#d6a650; --accent-soft:#3a2f1b; --brand:#5bb894; --brand-soft:#1d3329;
  --ok:#5cc28a; --ok-soft:#1b3326; --warn:#e3a843; --warn-soft:#3a2d14; --bad:#ec7b73; --bad-soft:#3d1e1c; --info:#7fb0e8; --info-soft:#1a2b3f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--ink);color:var(--ink-fg);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.seal{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--accent);font-size:20px;flex:none}
.brand b{font-family:var(--display);font-size:16px;display:block;line-height:1.3}
.brand small{opacity:.65;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;opacity:.78;font-weight:500}
.nav a:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav a.on{opacity:1;background:rgba(214,166,80,.16);color:#f0d49d}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:20px}
.side .foot{margin-top:auto;font-size:12px;opacity:.6;padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.menu-btn{display:none}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.search input{border:0;outline:0;background:none;width:100%}
.user{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:4px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.content{padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance;line-height:1.35}
.head p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .btn.pri{color:#0b1510}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1510}}
.btn:focus-visible,.nav a:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 a{font-size:13px;color:var(--brand);text-decoration:none;font-weight:500}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--display);line-height:1.5}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)} .down{color:var(--bad)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.alert b{color:var(--bad)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--muted)}
.time{font-variant-numeric:tabular-nums;font-weight:700;width:52px;text-align:center;color:var(--brand)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface2);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:right;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface2)}
td.num{font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
select.f,input.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:200px}
.col h3{margin:2px 4px 4px;font-size:13.5px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--brand)}
.card small{color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface2);padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
.cal .d{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.o{background:var(--surface2);opacity:.55}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ev{font-size:11.5px;padding:1px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 40px rgba(0,0,0,.2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.check{display:flex;gap:8px;align-items:center;padding:6px 0}
.check i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(0,0,0,.4);padding:16px}
.modal form{background:var(--surface);border-radius:12px;padding:22px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.modal input,.modal select,.modal textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--fg)}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 20px;border-radius:999px;z-index:40;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.dnum{display:flex;align-items:baseline;gap:6px;color:var(--accent)}
.dnum b{font-family:var(--display);font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums}
.dcard h3{margin:0;font-size:15px;line-height:1.5}
.dcard small{color:var(--muted);line-height:1.6}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow span{background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:13px;padding:5px 12px;border-radius:6px}
.flow i{font-style:normal;color:var(--muted)}
.tier{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.tier:first-of-type{border-top:0;padding-top:0}
.tier small{color:var(--muted)}
.tpl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tpl:first-of-type{border-top:0}
.tpl .ic{width:34px;height:34px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:var(--brand)}
.tpl .ic svg{width:18px;height:18px}
.tpl small{display:block;color:var(--muted)}
.demo{background:var(--accent-soft);color:var(--accent);font-size:12.5px;padding:6px 12px;border-radius:8px;font-weight:600}
.ring{--v:70;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--v)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.bars i{width:100%;max-width:34px;background:var(--brand);border-radius:4px 4px 0 0;display:block}
.bars i.b2{background:var(--accent)}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 0 0 auto;width:260px;z-index:25;transform:translateX(100%);transition:transform .2s;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .user .nm{display:none}
  .cal .d{min-height:64px} .cal .ev{font-size:0;height:6px;padding:0}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="seal">و</div><div><b style="font-size:20px">منصة وثيق</b><small>لإدارة مكاتب المحاماة</small></div></div>
    <div style="background:rgba(255,255,255,.06);border-radius:8px;padding:8px 12px;font-size:12.5px"><small style="opacity:.6;display:block">مساحة عمل المكتب</small><b>مكتب الرمز القانوني</b><button onclick="site()" style="display:block;margin-top:4px;background:none;border:0;padding:0;color:#f0d49d;cursor:pointer;font-size:12px">عرض موقع المكتب ←</button></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">وثيق من إتقان لخدمات الأعمال<br>نسخة عرض تجريبية · البيانات وهمية</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="ابحث برقم القضية أو اسم الموكل…"></label>
      <div class="user">
        <button class="iconbtn" id="themeBtn" aria-label="تبديل السمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="iconbtn" aria-label="التنبيهات" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span class="dot"></span></button>
        <div class="av">ف</div><div class="nm"><b style="font-size:13.5px;display:block;line-height:1.2">فيصل العتيبي</b><small style="color:var(--muted);font-size:12px">الشريك المدير</small></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>

<script>
const IC={
home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
cases:'<path d="M4 7h16v13H4zM9 7V4h6v3M4 12h16"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3.5 6"/>',
tasks:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
finance:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/>',
team:'<circle cx="12" cy="7" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>',
library:'<path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4 1-3 14-4-1z"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
IC.intake='<path d="M4 4h16v6H4zM4 14h7v6H4zM15 14l2 2 4-4"/>';
const NAV=[['home','الرئيسية'],['intake','الاستقبال والفحص'],['cases','القضايا'],['calendar','التقويم والجلسات'],['clients','الموكلون'],['tasks','المهام'],['finance','المالية'],['team','الفريق'],['ai','المساعد الذكي'],['library','المكتبة القانونية'],['settings','الإعدادات']];
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

const TEAM=[
 {id:1,n:'فيصل العتيبي',r:'الشريك المدير',lic:'محامٍ مرخّص',load:6,att:'حاضر'},
 {id:2,n:'نورة القحطاني',r:'محامية أولى',lic:'محامية مرخّصة',load:9,att:'حاضرة'},

function openCase(id){const c=CASES.find(x=>x.id===id);let tab=0;
 const checks=[['تحديد المحكمة ودرجة التقاضي',c.ready>=28],['إسناد محامٍ مسؤول',c.ready>=40],['إرفاق الوكالة',c.ready>=57],['صحيفة الدعوى',c.ready>=71],['المستندات المؤيدة',c.ready>=85],['قيد الدعوى في ناجز',c.ready>=100]];
 const evs=EVENTS.filter(e=>e.c===id);
 const draw=()=>{$('#layer').innerHTML=`<div class="drawer-bg" onclick="closeL()"></div><aside class="drawer" role="dialog" aria-label="ملف القضية">
 <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><small style="color:var(--muted)">قضية رقم ${num(c.id)} · ${c.type}</small><h2 style="font-family:var(--display);margin:2px 0 6px;font-size:21px">${c.title}</h2>${stPill(c.stage)}</div><button class="iconbtn" onclick="closeL()" aria-label="إغلاق">✕</button></div>
 ${c.judged?`<div class="alert"><div><b>آخر يوم للاعتراض: ${fd(addDays(c.judged,30))}</b><br><small>صدر الحكم ${fd(c.judged)}، والمتبقي ${num(dDiff(addDays(c.judged,30),TODAY))} يومًا.</small></div></div>`:''}
 <div class="tabs">${['البيانات','الجاهزية','الجلسات','المالية'].map((t,i)=>`<button class="${i===tab?'on':''}" data-t="${i}">${t}</button>`).join('')}</div>
 <div>${[
  `<dl class="dl"><dt>الموكل</dt><dd>${cl(c.client).n}</dd><dt>الخصم</dt><dd>${c.opp}</dd><dt>المحكمة</dt><dd>${c.court}</dd><dt>الدرجة</dt><dd>${c.deg}</dd><dt>المحامي المسؤول</dt><dd>${tm(c.lawyer).n}</dd><dt>رقم ناجز</dt><dd class="num">${c.najiz||'لم تُقيَّد بعد'}</dd><dt>الجلسة القادمة</dt><dd>${fd(c.next)}</dd></dl>`,
  `<div style="display:flex;gap:14px;align-items:center;margin-bottom:8px"><div class="ring" style="--v:${c.ready}"><span>${num(c.ready)}٪</span></div><b>${c.ready<100?'الملف غير جاهز للإيداع بعد':'الملف مكتمل ومقيّد'}</b></div>${checks.map(k=>`<div class="check"><i style="background:${k[1]?'var(--ok-soft)':'var(--surface2)'};color:${k[1]?'var(--ok)':'var(--muted)'}">${k[1]?'✓':''}</i>${k[0]}</div>`).join('')}`,
  evs.length?`<div class="list">${evs.map(e=>`<div class="row"><span class="time">${e.t}</span><div class="t"><b>${e.txt}</b><small>${fd(e.d)}</small></div><span class="pill" style="${evStyle(e.k)}">${e.k}</span></div>`).join('')}</div>`:'<p style="color:var(--muted)">لا جلسات مسجلة بعد.</p>',
  `<dl class="dl"><dt>الأتعاب المتفق عليها</dt><dd>${sar(c.fee)}</dd><dt>المحصّل</dt><dd class="up">${sar(c.paid)}</dd><dt>المتبقي</dt><dd style="color:${c.fee-c.paid?'var(--warn)':'var(--ok)'}">${sar(c.fee-c.paid)}</dd></dl><div class="bar" style="margin-top:12px"><i style="width:${c.paid/c.fee*100}%"></i></div>`][tab]}</div>
 <div class="actions" style="margin-top:auto">${c.stage<4?`<button class="btn pri" onclick="advance(${c.id})">نقل إلى: ${STAGES[c.stage+1]}</button>`:''}<button class="btn" onclick="toast('أُرسل تحديث للموكل عبر واتساب (عرض تجريبي)')">إرسال تحديث للموكل</button><button class="btn" onclick="aiCase=${c.id};aiOut='';closeL();location.hash='ai'">صياغة بالمساعد الذكي</button></div></aside>`;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;draw()})};draw()}

 const id=Math.max(...CASES.map(c=>c.id))+1;CASES.unshift({id,title:$('#f1').value,client:+$('#f2').value,opp:'—',type:t,court:courts[t],deg:'الدرجة الأولى',stage:0,lawyer:+$('#f4').value,fee:+$('#f5').value||0,paid:0,next:'',ready:28,najiz:''});
 closeL();location.hash='cases';render();toast('لا يوجد تعارض مصالح. حُفظت القضية رقم '+num(id))}}

function conflict(){$('#layer').innerHTML=`<div class="modal"><form id="cf"><h2 style="margin:0;font-family:var(--display);font-size:19px">فحص تعارض المصالح</h2><label>اسم الطرف الآخر أو رقم سجله<input id="cq" required placeholder="مثال: ياسر الغامدي"></label><div id="cr"></div><div class="actions"><button class="btn pri">افحص</button><button class="btn" type="button" onclick="closeL()">إغلاق</button></div></form></div>`;
 $('#cf').onsubmit=e=>{e.preventDefault();const q=$('#cq').value.trim();const hit=CASES.filter(c=>c.opp.includes(q)||cl(c.client).n.includes(q));
 $('#cr').innerHTML=hit.length?`<div class="alert"><div><b>يوجد تعارض محتمل:</b> الاسم مرتبط بالقضية ${hit.map(h=>num(h.id)).join('، ')}.</div></div>`:`<div class="alert" style="background:var(--ok-soft);border-color:transparent"><div><b style="color:var(--ok)">لا يوجد تعارض.</b> يمكن قبول القضية.</div></div>`}}

function checkIn(){checked=!checked;ATT[0][1]=checked?'07:52':'07:52';render();toast(checked?'سُجّل حضورك الساعة ٧:٥٢ ص':'سُجّل انصرافك')}
function acceptV(id){const v=VISITS.find(x=>x.id===id);v.st='قُبلت وفُتح ملف';const cid=Math.max(...CASES.map(c=>c.id))+1;
 CLIENTS.push({id:CLIENTS.length+1,n:v.n,t:v.n.startsWith('شركة')?'شركة':'فرد',cr:'—',ph:v.ph,cases:1,due:0});
 CASES.unshift({id:cid,title:v.sub,client:CLIENTS.length,opp:'—',type:'عام',court:'يُحدد لاحقًا',deg:'الدرجة الأولى',stage:0,lawyer:2,fee:0,paid:0,next:'',ready:14,najiz:''});
 render();toast('قُبل الطلب وفُتح ملف القضية رقم '+num(cid)+' وأُضيف الموكل')}
function rejectV(id){VISITS.find(x=>x.id===id).st='مرفوضة';render();toast('رُفض الطلب وأُبلغ الزائر')}
function conflictFor(id){conflict();$('#cq').value=VISITS.find(x=>x.id===id).n;$('#cf').requestSubmit()}
function newVisit(){$('#layer').innerHTML=`<div class="modal"><form id="vf"><h2 style="margin:0;font-family:var(--display);font-size:19px">تسجيل زيارة</h2>
 <label>اسم الزائر<input id="v1" required></label><label>الجوال<input id="v2" dir="ltr" placeholder="05XXXXXXXX"></label>
 <label>نوع الزيارة<select id="v3"><option>قضية جديدة</option><option>استشارة</option><option>متابعة قضية قائمة</option></select></label>
 <label>الموضوع<textarea id="v4" rows="3" required></textarea></label>
 <div class="actions"><button class="btn pri">حفظ</button><button class="btn" type="button" onclick="closeL()">إلغاء</button></div></form></div>`;
 $('#vf').onsubmit=e=>{e.preventDefault();const k=$('#v3').value;VISITS.unshift({id:VISITS.length+1,n:$('#v1').value,ph:$('#v2').value||'—',t:'2026-11-01 10:30',sub:$('#v4').value,kind:k,st:k==='قضية جديدة'?'بانتظار الفحص':'تمت الاستشارة',by:4});closeL();render();toast(k==='قضية جديدة'?'سُجّلت الزيارة وأُحيلت للفحص':'سُجّلت الزيارة')}}
function broadcast(){$('#layer').innerHTML=`<div class="modal"><form id="bf"><h2 style="margin:0;font-family:var(--display);font-size:19px">رسالة واتساب جماعية</h2>
 <label>المستلمون<select id="b1"><option value="all">كل الموكلين (${num(CLIENTS.length)})</option><option value="co">الشركات فقط</option><option value="due">من عليهم مستحقات</option><option value="hear">من لديهم جلسات هذا الأسبوع</option></select></label>
 <label>القالب<select id="b2" onchange="$('#b3').value=this.value"><option value="عميلنا العزيز {الاسم}، نذكّركم بموعد جلستكم يوم {التاريخ}. مكتب الرمز القانوني.">تذكير بموعد جلسة</option><option value="عميلنا العزيز {الاسم}، نود تذكيركم بوجود مبلغ مستحق قدره {المبلغ}. شاكرين تعاونكم.">تذكير بمستحقات</option><option value="بمناسبة اليوم الوطني، يسعد مكتب الرمز القانوني أن يهنئكم.">تهنئة بمناسبة</option></select></label>
 <label>نص الرسالة<textarea id="b3" rows="4">عميلنا العزيز {الاسم}، نذكّركم بموعد جلستكم يوم {التاريخ}. مكتب الرمز القانوني.</textarea></label>
 <small style="color:var(--muted)">الكلمات بين القوسين تُستبدل تلقائيًا ببيانات كل موكل.</small>
 <div class="actions"><button class="btn pri">إرسال</button><button class="btn" type="button" onclick="closeL()">إلغاء</button></div></form></div>`;
 $('#bf').onsubmit=e=>{e.preventDefault();const m={all:CLIENTS.length,co:CLIENTS.filter(c=>c.t==='شركة').length,due:CLIENTS.filter(c=>c.due).length,hear:3}[$('#b1').value];closeL();toast('جُهّزت '+num(m)+' رسائل للإرسال (عرض تجريبي)')}}
function display(){const ev=EVENTS.filter(e=>e.d>=TODAY).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)).slice(0,6);
 $('#layer').innerHTML=`<div class="modal" style="background:var(--ink);color:var(--ink-fg);place-items:stretch;padding:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-left,0px))"><div style="display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;width:100%">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div style="display:flex;gap:12px;align-items:center"><div class="seal">ت</div><div><b style="font-family:var(--display);font-size:22px">جدول الجلسات والمواعيد</b><small style="display:block;opacity:.6">شاشة العرض في المكتب · تتحدث تلقائيًا</small></div></div><button class="btn" onclick="closeL()">إغلاق</button></div>
 ${ev.map(e=>{const c=e.c&&CASES.find(x=>x.id===e.c);return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:14px 18px;border-radius:10px;background:rgba(255,255,255,.05)"><b style="font-family:var(--display);font-size:24px;color:#f0d49d;font-variant-numeric:tabular-nums">${e.t}</b><div style="min-width:0"><b style="font-size:17px">${e.txt}</b><small style="display:block;opacity:.65">${fd(e.d)}${c?' · '+c.court+' · '+tm(c.lawyer).n:''}</small></div><span class="pill" style="background:rgba(255,255,255,.1);color:inherit">${e.k}</span></div>`}).join('')}</div></div>`}

/* ---------- AI assistant ---------- */
IC.ai='<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>';
let aiCase=1044,aiTask=0,aiOut='';
const AITASKS=['صياغة مذكرة جوابية','تلخيص ملف القضية','بحث في الأنظمة السعودية','لائحة اعتراضية على حكم'];
function aiText(){const c=CASES.find(x=>x.id===aiCase);const k=cl(c.client).n;
 const law=c.type==='عمالي'?'نظام العمل ولائحته التنفيذية':c.type==='تجاري'?'نظام المحاكم التجارية ولائحته التنفيذية':c.type==='إداري'?'نظام المرافعات أمام ديوان المظالم':'نظام المرافعات الشرعية';
 return [
 `بسم الله الرحمن الرحيم\nفضيلة رئيس ${c.court} وفقه الله\nالسلام عليكم ورحمة الله وبركاته\n\nالموضوع: مذكرة جوابية في الدعوى رقم ${c.najiz||'(رقم ناجز)'}\nالموكل: ${k}\nالطرف الآخر: ${c.opp}\n\nأولًا: الوقائع\nتتلخص وقائع الدعوى في ${c.title}، وقد قدّم موكلنا ما يثبت حقه من مستندات مرفقة بملف القضية.\n\nثانيًا: الدفوع\n١. ...\n٢. ...\n\nثالثًا: الطلبات\nنلتمس من فضيلتكم الحكم لموكلنا بطلباته الواردة في صحيفة الدعوى.\n\nوالله يحفظكم ويرعاكم،\nوكيل الموكل`,
 `ملخص القضية رقم ${num(c.id)}\n\n• الموضوع: ${c.title}\n• الأطراف: ${k} ضد ${c.opp}\n• المحكمة: ${c.court} — ${c.deg}\n• المرحلة الحالية: ${STAGES[c.stage]}\n• جاهزية الملف: ${num(c.ready)}٪\n• الأتعاب: ${sar(c.fee)}، المحصّل منها ${sar(c.paid)}\n\nنقاط تحتاج انتباهًا:\n${c.ready<100?'• الملف غير مكتمل للإيداع.\n':''}${c.fee>c.paid?'• توجد أتعاب لم تُحصّل بعد.\n':''}${c.judged?'• صدر حكم، وآخر يوم للاعتراض '+fd(addDays(c.judged,30))+'.':'• لا توجد مواعيد نظامية جارية.'}`,
 `بحث نظامي حول: ${c.title} (${c.type})\n\nالأنظمة ذات الصلة:\n• ${law}\n• نظام الإثبات\n\nفي النسخة الفعلية يبحث المساعد في نصوص الأنظمة السعودية، ويذكر رقم المادة ونصها، ويربطها بوقائع القضية.`,
 `لائحة اعتراضية\n\nأصحاب الفضيلة قضاة محكمة الاستئناف وفقهم الله\n\nنتقدم بلائحتنا الاعتراضية على الحكم الصادر في القضية رقم ${num(c.id)} (${c.title})${c.judged?' بتاريخ '+fd(c.judged):''}، وذلك خلال المدة النظامية.\n\nأسباب الاعتراض:\n١. ...\n٢. ...\n\nالطلبات:\nنقض الحكم، والحكم لموكلنا بطلباته.`][aiTask]}
V.ai=()=>`<div class="head"><div><h1>المساعد الذكي</h1><p>يصوغ المذكرات ويلخص القضايا ويبحث في الأنظمة، اعتمادًا على بيانات ملف القضية نفسه.</p></div><span class="demo">نتائج تجريبية للعرض</span></div>
<div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><section class="panel" style="display:flex;flex-direction:column;gap:12px"><label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)">القضية<select class="f" id="aic" onchange="aiCase=+this.value;aiOut='';render()">${CASES.map(c=>`<option value="${c.id}" ${c.id===aiCase?'selected':''}>${num(c.id)} — ${c.title}</option>`).join('')}</select></label>
<div style="display:flex;flex-direction:column;gap:6px">${AITASKS.map((t,i)=>`<button class="btn" style="justify-content:flex-start;${i===aiTask?'border-color:var(--brand);background:var(--brand-soft);color:var(--brand)':''}" onclick="aiTask=${i};aiOut='';render()">${t}</button>`).join('')}</div>
<button class="btn pri" onclick="runAI()">${svg('ai').replace('<svg','<svg width="16" height="16"')} أنشئ المسودة</button><small style="color:var(--muted)">كل ما يكتبه المساعد مسودة، ويراجعها المحامي قبل اعتمادها.</small></section>
<section class="panel"><h2>المسودة ${aiOut?`<span class="actions"><button class="btn" style="padding:4px 10px;font-size:13px" onclick="copyAI()">نسخ</button><button class="btn" style="padding:4px 10px;font-size:13px" onclick="toast('حُفظت المسودة في ملف القضية')">حفظ في ملف القضية</button></span>`:''}</h2><pre id="aiout" style="white-space:pre-wrap;font-family:var(--body);margin:0;line-height:1.9;min-height:280px;color:${aiOut?'var(--fg)':'var(--muted)'}">${aiOut||'اختر القضية ونوع المهمة، ثم اضغط «أنشئ المسودة».'}</pre></section></div>`;
function runAI(){const full=aiText();aiOut=' ';render();const el=$('#aiout');el.textContent='';let i=0;const tick=()=>{if(!document.contains(el))return;i=Math.min(full.length,i+6);el.textContent=full.slice(0,i);if(i<full.length)setTimeout(tick,12);else{aiOut=full;render()}};tick()}
function copyAI(){try{navigator.clipboard.writeText(aiOut).then(()=>toast('نُسخت المسودة'),()=>toast('حدد النص وانسخه يدويًا'))}catch(e){toast('حدد النص وانسخه يدويًا')}}

/* ---------- trust accounts ---------- */
let TRUST=[{c:2,bal:4000,mv:[['إيداع لأتعاب الخبير','+',10000],['سداد أتعاب الخبير المحاسبي','-',6000]]},{c:4,bal:8000,mv:[['إيداع رسوم التنفيذ','+',8000]]},{c:1,bal:3500,mv:[['إيداع لمصروفات القضية','+',5000],['رسوم ترجمة معتمدة','-',1500]]}];
function trustPanel(){return `<section class="panel"><h2>أمانات الموكلين <span class="actions"><button class="btn" style="padding:4px 10px;font-size:13px" onclick="trustOp('+')">+ إيداع</button><button class="btn" style="padding:4px 10px;font-size:13px" onclick="trustOp('-')">− صرف</button></span></h2><p style="margin:0 0 10px;color:var(--muted);font-size:13px">أموال يودعها الموكل لدى المكتب لدفع رسوم ومصروفات قضيته. تُحفظ منفصلة عن إيرادات المكتب، ولا يُسمح بصرف أكثر من الرصيد.</p><div class="tablewrap" style="border:0"><table style="min-width:520px"><thead><tr><th>الموكل</th><th>الرصيد المودع</th><th>آخر حركة</th></tr></thead><tbody>${TRUST.map(t=>{const m=t.mv[t.mv.length-1];return `<tr><td><b>${cl(t.c).n}</b></td><td class="num"><b>${sar(t.bal)}</b></td><td>${m[0]} <span class="${m[1]==='+'?'up':'down'}">${m[1]==='+'?'+':'−'}${sar(m[2])}</span></td></tr>`}).join('')}</tbody></table></div></section>`}
function trustOp(s){$('#layer').innerHTML=`<div class="modal"><form id="tf2"><h2 style="margin:0;font-family:var(--display);font-size:19px">${s==='+'?'إيداع أمانة':'صرف من أمانة'}</h2><label>الموكل<select id="t1">${TRUST.map(t=>`<option value="${t.c}">${cl(t.c).n} — الرصيد ${sar(t.bal)}</option>`).join('')}</select></label><label>المبلغ (ر.س)<input id="t2" type="number" min="1" required></label><label>البيان<input id="t3" required placeholder="${s==='+'?'مثال: إيداع رسوم خبير':'مثال: سداد رسوم ترجمة'}"></label><div id="terr"></div><div class="actions"><button class="btn pri">حفظ</button><button class="btn" type="button" onclick="closeL()">إلغاء</button></div></form></div>`;
 $('#tf2').onsubmit=e=>{e.preventDefault();const t=TRUST.find(x=>x.c===+$('#t1').value),a=+$('#t2').value;if(s==='-'&&a>t.bal){$('#terr').innerHTML=`<div class="alert"><div><b>الرصيد لا يكفي.</b> رصيد الموكل ${sar(t.bal)} فقط، والنظام يمنع الصرف بأكثر منه.</div></div>`;return}t.bal+=s==='+'?a:-a;t.mv.push([$('#t3').value,s,a]);closeL();render();toast('سُجّلت الحركة، والرصيد الآن '+sar(t.bal))}}
const _fin=V.finance;V.finance=()=>_fin()+trustPanel();

/* ---------- office website ---------- */
function sitePanel(){return `<section class="panel" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between"><div style="min-width:0;flex:1 1 280px"><h2 style="margin:0 0 4px">موقع المكتب التعريفي</h2><small style="color:var(--muted)">صفحة جاهزة للمكتب على الإنترنت فيها خدماته وزر لطلب استشارة. كل طلب يصل مباشرة إلى قسم الاستقبال.</small><div class="num" dir="ltr" style="margin-top:6px;font-weight:600;color:var(--brand);text-align:right">alramz.wathiq.sa</div></div><button class="btn pri" onclick="site()">معاينة الموقع</button></section>`}
function site(){$('#layer').innerHTML=`<div class="modal" style="place-items:start center;overflow:auto"><div style="background:var(--surface);border-radius:12px;width:min(820px,100%);overflow:hidden">
<div style="background:var(--ink);color:var(--ink-fg);padding:28px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-family:var(--display);font-size:18px">مكتب الرمز القانوني</b><button class="btn" onclick="closeL()">إغلاق المعاينة</button></div><h2 style="font-family:var(--display);font-size:28px;margin:10px 0 0;line-height:1.4;text-wrap:balance">نقف إلى جانبك في كل مراحل قضيتك</h2><p style="margin:0;opacity:.75">محامون مرخّصون في القضايا التجارية والعمالية والأحوال الشخصية والإدارية بمدينة الرياض.</p></div>
<div style="padding:24px;display:flex;flex-direction:column;gap:20px"><div class="dgrid">${[['القضايا التجارية','العقود والمطالبات ونزاعات الشركات'],['القضايا العمالية','حقوق العامل وصاحب العمل'],['الأحوال الشخصية','الحضانة والنفقة والتركات'],['القضايا الإدارية','الطعن على القرارات أمام ديوان المظالم']].map(s=>`<div class="dcard"><h3>${s[0]}</h3><small>${s[1]}</small></div>`).join('')}</div>
<form id="sf" style="background:none;padding:0;width:auto;max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end"><b style="grid-column:1/-1;font-size:16px">اطلب استشارة</b><input class="f" id="s1" required placeholder="الاسم"><input class="f" id="s2" dir="ltr" placeholder="05XXXXXXXX" required><input class="f" id="s3" required placeholder="موضوع الاستشارة باختصار" style="grid-column:1/-1"><button class="btn pri">أرسل الطلب</button></form></div></div></div>`;
 $('#sf').onsubmit=e=>{e.preventDefault();VISITS.unshift({id:VISITS.length+1,n:$('#s1').value,ph:$('#s2').value,t:'2026-11-01 11:00',sub:$('#s3').value+' (من موقع المكتب)',kind:'قضية جديدة',st:'بانتظار الفحص',by:4});closeL();if(location.hash==='#intake')render();else location.hash='intake';toast('وصل الطلب إلى قسم الاستقبال من موقع المكتب')}}
const _set=V.settings;V.settings=()=>_set()+sitePanel();

/* ---------- shell ---------- */
function route(){const h=location.hash.slice(1);return V[h]?h:'home'}
function render(){const r=route();
 $('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===r?'on':''}">${svg(k)}${l}${k==='cases'?`<span class="cnt">${num(CASES.filter(c=>c.stage<4).length)}</span>`:k==='tasks'?`<span class="cnt">${num(TASKS.filter(t=>t.st!=='منجزة').length)}</span>`:''}</a>`).join('');
 $('#view').innerHTML=V[r]();$('#side').classList.remove('open')}
window.addEventListener('hashchange',()=>{closeL();render();window.scrollTo(0,0)});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#q').addEventListener('input',()=>{if(route()!=='cases')location.hash='cases';else render()});
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeL()});
render();
</script>
